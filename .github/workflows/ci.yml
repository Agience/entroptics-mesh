name: ci
# Tests the mesh against the published stack: entroptics-rf and the core entroptics both come from
# PyPI through this package's dependencies. SDR extras are not installed (they need
# libiio/librtlsdr); CI covers the pure-software path.
on:
  push:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: test (py ${{ matrix.python-version }}, reference path)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (entroptics-rf and entroptics from PyPI)
        run: |
          python -m pip install --upgrade pip
          pip install "entroptics-rf>=0.1"
          pip install -e ".[test]" pytest-cov
      - name: Test (ENTROPTICS_FAST=0, pure-Python reference) + coverage
        env:
          OPENBLAS_NUM_THREADS: "1"
          ENTROPTICS_FAST: "0"
        run: pytest -q -p no:cacheprovider -W ignore --cov=entroptics_mesh --cov-report=term-missing

  compiled-kernels:
    name: compiled kernels (ENTROPTICS_FAST=1, numba)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (+ numba for the compiled path)
        run: |
          python -m pip install --upgrade pip
          pip install "entroptics-rf>=0.1" numba
          pip install -e ".[test]"
      - name: Test (compiled _fast kernels; internal bit-identity gates must pass)
        env:
          OPENBLAS_NUM_THREADS: "1"
          ENTROPTICS_FAST: "1"
        run: pytest -q -p no:cacheprovider -W ignore
